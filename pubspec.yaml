name: promptforge_ai_v2
description: "PromptForge AI - AI Story Director. Converts a full story into structured cinematic AI video prompts with automatic character consistency tracking."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Local persistence (offline drafts)
  shared_preferences: ^2.2.3

  # For generating stable unique ids for scenes/characters
  uuid: ^4.4.0

  # Nice expandable/animated UI
  flutter_animate: ^4.5.0

  # File export / sharing
  path_provider: ^2.1.3
  share_plus: ^9.0.0

  # PDF export
  pdf: ^3.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
